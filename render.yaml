services:
  - type: web
    name: proofpay-api
    runtime: node
    rootDir: apps/api
    buildCommand: npm install && npx prisma generate --schema ../../prisma/schema.prisma && npm run build
    startCommand: npm start
  - type: web
    name: proofpay-web
    rootDir: apps/web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
  - type: workflow
    name: proofpay-verification
    runtime: node
    rootDir: workflows
    buildCommand: npm install && npm run build
    startCommand: npm start
