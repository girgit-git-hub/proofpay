services:
  postgres:
    image: postgres:17-alpine
    container_name: proofpay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: proofpay
      POSTGRES_PASSWORD: proofpay
      POSTGRES_DB: proofpay
    ports:
      - "5432:5432"
    volumes:
      - proofpay_pg:/var/lib/postgresql/data
volumes:
  proofpay_pg:
